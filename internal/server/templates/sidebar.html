{{define "sidebar"}}
<aside class="sidebar" aria-label="Main navigation">
  <a href="/" class="brand" aria-label="ForYou home"><span class="brand-icon">{{template "icon-nav-brand" .}}</span><span class="brand-word">ForYou</span></a>
  <nav class="sidebar-nav" aria-label="Primary">
    <a class="nav-link {{if eq .Section "home"}}is-current{{end}}" href="/" {{if eq .Section "home"}}aria-current="page"{{end}} aria-label="Home">{{template "icon-nav-home" .}}<span>Home</span></a>
    <a class="nav-link {{if eq .Section "explore"}}is-current{{end}}" href="/explore" {{if eq .Section "explore"}}aria-current="page"{{end}} aria-label="Explore">{{template "icon-nav-explore" .}}<span>Explore</span></a>
    <a class="nav-link {{if eq .Section "settings"}}is-current{{end}}" href="/settings" {{if eq .Section "settings"}}aria-current="page"{{end}} aria-label="Settings">{{template "icon-nav-settings" .}}<span>Settings</span></a>
  </nav>
  <a href="/compose" class="nav-compose {{if eq .Section "compose"}}is-current{{end}}" {{if eq .Section "compose"}}aria-current="page"{{end}} aria-label="New post">{{template "icon-nav-compose" .}}<span>New post</span></a>
  <div class="account-block"><span class="identicon violet" aria-hidden="true"></span><div><strong>Your space</strong><small>No account connected</small></div></div>
</aside>
{{end}}
