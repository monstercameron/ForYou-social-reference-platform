{{define "report-card-link"}}{{if .AuthorID}}<a class="report-card-link" href="/report?id={{.ID}}" aria-label="Report this post to its provider" title="Report">{{template "report-icon-flag"}}</a>{{end}}{{end}}
{{define "report-detail-action"}}{{if .AuthorID}}<a class="post-action report-detail-action" href="/report?id={{.ID}}">{{template "report-icon-flag"}}<span>Report</span></a>{{end}}{{end}}
{{define "report-icon-flag"}}<svg class="post-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" fill="none" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>{{end}}
