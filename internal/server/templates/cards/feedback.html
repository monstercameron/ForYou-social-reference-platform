{{define "card-feedback-controls"}}<div id="feedback-{{.ID}}" class="feedback-control" role="group" aria-label="Personal feed feedback" aria-live="polite">
  <form data-feedback-vote="up" data-focus-after-swap="#feedback-{{.ID}} form[data-feedback-vote='up'] button" action="/feedback" method="post" post="/feedback/fragment" target="#feedback-{{.ID}}(outerHTML)" timeout="5000" onerror="this(after)"><input type="hidden" name="id" value="{{.ID}}"><input type="hidden" name="vote" value="{{if eq .Feedback "up"}}clear{{else}}up{{end}}"><button class="post-action feedback-button feedback-up" type="submit" aria-label="Like" aria-pressed="{{if eq .Feedback "up"}}true{{else}}false{{end}}">{{template "card-icon-post-up"}}<span>Like</span></button></form>
  <form data-feedback-vote="down" data-focus-after-swap="#feedback-{{.ID}} form[data-feedback-vote='down'] button" action="/feedback" method="post" post="/feedback/fragment" target="#feedback-{{.ID}}(outerHTML)" timeout="5000" onerror="this(after)"><input type="hidden" name="id" value="{{.ID}}"><input type="hidden" name="vote" value="{{if eq .Feedback "down"}}clear{{else}}down{{end}}"><button class="post-action feedback-button feedback-down" type="submit" aria-label="Dislike" aria-pressed="{{if eq .Feedback "down"}}true{{else}}false{{end}}">{{template "card-icon-post-down"}}<span>Dislike</span></button></form>
</div>{{end}}
