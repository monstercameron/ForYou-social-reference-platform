{{define "card-post-video"}}{{if eq .Art "video"}}<div id="video-{{key .ID}}" class="post-media-frame video-facade"><form action="/feed" method="get" get="/feed" target="#video-{{key .ID}}(outerHTML)" timeout="10000" onerror="#thread-error(innerHTML)"><input type="hidden" name="play" value="{{.ID}}"><button class="video-play" type="submit" aria-label="Play Flower video">{{template "card-icon-post-play"}}</button></form><img class="video-poster" src="/static/demo-flower-poster.svg" alt="" loading="lazy"><noscript><video class="post-video" controls preload="none" playsinline poster="/static/demo-flower-poster.svg" aria-label="Flower video"><source src="/static/demo-flower.mp4" type="video/mp4">Your browser does not support video.</video></noscript></div>{{else if eq .Art "tech-video"}}<div id="video-{{key .ID}}" class="post-media-frame video-facade"><form action="/feed" method="get" get="/feed" target="#video-{{key .ID}}(outerHTML)" timeout="10000" onerror="#thread-error(innerHTML)"><input type="hidden" name="play" value="{{.ID}}"><button class="video-play" type="submit" aria-label="Play Home server monitor video">{{template "card-icon-post-play"}}</button></form><img class="video-poster" src="/static/demo-tech-poster.svg" alt="" loading="lazy"><noscript><video class="post-video" controls preload="none" playsinline poster="/static/demo-tech-poster.svg" aria-label="Home server monitor video"><source src="/static/demo-tech.mp4" type="video/mp4">Your browser does not support video.</video></noscript></div>{{end}}{{end}}
{{define "card-post-video-player"}}{{if eq .Art "video"}}<div id="video-{{key .ID}}" class="post-media-frame post-video-player"><video class="post-video" controls autoplay playsinline preload="auto" poster="/static/demo-flower-poster.svg" aria-label="Flower video"><source src="/static/demo-flower.mp4" type="video/mp4">Your browser does not support video.</video></div>{{else}}<div id="video-{{key .ID}}" class="post-media-frame post-video-player"><video class="post-video" controls autoplay playsinline preload="auto" poster="/static/demo-tech-poster.svg" aria-label="Home server monitor video"><source src="/static/demo-tech.mp4" type="video/mp4">Your browser does not support video.</video></div>{{end}}{{end}}
{{define "card-video-player-response"}}<fragment target="#video-{{key .ID}}(outerHTML)">{{template "card-post-video-player" .}}</fragment>{{end}}
