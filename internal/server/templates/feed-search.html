{{define "feed-search"}}<form class="feed-search" action="{{if eq .Section "explore"}}/explore{{else}}/{{end}}" method="get" role="search">
  <input type="hidden" name="filter" value="{{.Filter}}"><input type="hidden" name="theme" value="{{.Theme}}">
  <label for="feed-search-input" class="sr-only">Search posts</label>
  <input id="feed-search-input" name="q" type="search" maxlength="120" value="{{.Query}}" placeholder="Search posts">
  <button type="submit">Search</button>
</form>{{end}}
