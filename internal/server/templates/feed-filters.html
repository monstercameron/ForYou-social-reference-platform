{{define "filter-all"}}<form action="/" method="get"><input type="hidden" name="theme" value="{{.Theme}}"><input type="hidden" name="q" value="{{.Query}}"><input type="hidden" name="filter" value="all"><button {{if eq .Filter "all"}}aria-current="page"{{end}} class="min-h-10 rounded-full border-0 px-3 text-xs font-semibold transition-colors {{if eq .Filter "all"}}bg-[var(--accent)] text-[var(--on-accent)]{{else}}bg-[var(--control)] text-[var(--muted)] hover:bg-[var(--accent-soft)]{{end}}">All</button></form>{{end}}
