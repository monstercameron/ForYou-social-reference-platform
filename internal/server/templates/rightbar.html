{{define "rightbar"}}
<aside class="hidden bg-[var(--subtle)] min-[851px]:block">
  <div class="sticky top-0 p-5 min-[1101px]:p-6">
    <form class="flex items-center gap-2 rounded-full border border-[var(--line)] bg-[var(--control)] px-3" action="{{if eq .Section "explore"}}/explore{{else}}/{{end}}" method="get">
      <span class="text-xl text-[var(--muted)]" aria-hidden="true">⌕</span><input class="min-h-11 min-w-0 flex-1 border-0 bg-transparent text-[var(--text)]" type="search" name="q" aria-label="Search posts" placeholder="Search ForYou" value="{{.Query}}"><input type="hidden" name="theme" value="{{.Theme}}"><input type="hidden" name="filter" value="{{.Filter}}"><button class="min-h-11 border-0 bg-transparent text-xs font-semibold text-[var(--accent)] hover:underline" type="submit">Search</button>
    </form>
    {{template "network-panel" .}}
    {{template "about-panel" .}}
    <div class="mt-6 flex gap-2 text-xs text-[var(--muted)]"><span>Appearance</span><a class="text-[var(--accent)] hover:underline" href="{{if eq .Section "explore"}}/explore{{else}}/{{end}}?theme=light&amp;filter={{.Filter}}&amp;q={{.Query}}">Light</a><span>·</span><a class="text-[var(--accent)] hover:underline" href="{{if eq .Section "explore"}}/explore{{else}}/{{end}}?theme=dark&amp;filter={{.Filter}}&amp;q={{.Query}}">Dark</a></div>
  </div>
</aside>
{{end}}
