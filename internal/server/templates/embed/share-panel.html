{{define "share-panel"}}<section class="share-panel" aria-labelledby="share-title-{{key .Post.ID}}"><div class="share-heading"><h2 id="share-title-{{key .Post.ID}}" tabindex="-1">Share this post</h2><form class="thread-action" data-share-close action="/posts/{{.Post.ID}}" method="get"{{if not .Standalone}} get="/share/fragment" target="#share-{{key .Post.ID}}(innerHTML)" timeout="5000" onerror="#thread-error(innerHTML)"{{end}}><input type="hidden" name="id" value="{{.Post.ID}}"><input type="hidden" name="view" value="closed"><button class="detail-control" type="submit" data-focus-return aria-controls="share-{{key .Post.ID}}">Close</button></form></div>{{if .NoOrigin}}<p class="share-notice" role="status">Sharing needs a public address for this client.</p>{{else}}<div class="share-theme"><span class="share-label" id="share-theme-{{key .Post.ID}}">Embed color</span><div class="share-options" role="group" aria-labelledby="share-theme-{{key .Post.ID}}"><form action="/share" method="get"{{if not .Standalone}} get="/share/fragment" target="#share-{{key .Post.ID}}(innerHTML)" timeout="5000" onerror="#thread-error(innerHTML)" data-focus-after-swap="#share-title-{{key .Post.ID}}"{{end}}><input type="hidden" name="id" value="{{.Post.ID}}"><input type="hidden" name="theme" value="light"><button class="share-option" type="submit" aria-pressed="{{if eq .Theme "light"}}true{{else}}false{{end}}">Light</button></form><form action="/share" method="get"{{if not .Standalone}} get="/share/fragment" target="#share-{{key .Post.ID}}(innerHTML)" timeout="5000" onerror="#thread-error(innerHTML)" data-focus-after-swap="#share-title-{{key .Post.ID}}"{{end}}><input type="hidden" name="id" value="{{.Post.ID}}"><input type="hidden" name="theme" value="dark"><button class="share-option" type="submit" aria-pressed="{{if eq .Theme "dark"}}true{{else}}false{{end}}">Dark</button></form><form action="/share" method="get"{{if not .Standalone}} get="/share/fragment" target="#share-{{key .Post.ID}}(innerHTML)" timeout="5000" onerror="#thread-error(innerHTML)" data-focus-after-swap="#share-title-{{key .Post.ID}}"{{end}}><input type="hidden" name="id" value="{{.Post.ID}}"><input type="hidden" name="theme" value=""><button class="share-option" type="submit" aria-pressed="{{if not .Theme}}true{{else}}false{{end}}">Match reader</button></form></div></div><label for="post-link-{{key .Post.ID}}">Post link</label><input class="share-field" id="post-link-{{key .Post.ID}}" type="text" readonly value="{{.PostURL}}"><label for="embed-code-{{key .Post.ID}}">Embed code</label><textarea class="share-field share-code" id="embed-code-{{key .Post.ID}}" readonly rows="6">{{.Code}}</textarea><p class="share-note">Copy the link or the embed code. They open only for people who can reach this ForYou server.</p>{{end}}<p class="share-id">Message ID <span class="share-id-value">{{.Post.ID}}</span></p></section>{{end}}
