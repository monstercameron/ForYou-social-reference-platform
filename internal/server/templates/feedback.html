{{define "feedback-controls"}}<div id="feedback-{{.ID}}" class="feedback-control flex flex-wrap items-center gap-1" role="group" aria-label="Personal feed feedback" aria-live="polite">
  <form data-feedback-vote="up" action="/feedback" method="post" post="/feedback/fragment" target="#feedback-{{.ID}}(outerHTML)" timeout="5000" onerror="this(after)"><input type="hidden" name="id" value="{{.ID}}"><input type="hidden" name="vote" value="{{if eq .Feedback "up"}}clear{{else}}up{{end}}"><button class="min-h-11 min-w-11 rounded-full border-0 bg-transparent px-2 text-sm transition-colors hover:bg-[var(--accent-soft)] {{if eq .Feedback "up"}}text-[var(--accent)]{{else}}text-[var(--muted)]{{end}}" type="submit" aria-label="Positive feedback" aria-pressed="{{if eq .Feedback "up"}}true{{else}}false{{end}}">👍</button></form>
  <form data-feedback-vote="down" action="/feedback" method="post" post="/feedback/fragment" target="#feedback-{{.ID}}(outerHTML)" timeout="5000" onerror="this(after)"><input type="hidden" name="id" value="{{.ID}}"><input type="hidden" name="vote" value="{{if eq .Feedback "down"}}clear{{else}}down{{end}}"><button class="min-h-11 min-w-11 rounded-full border-0 bg-transparent px-2 text-sm transition-colors hover:bg-[var(--accent-soft)] {{if eq .Feedback "down"}}text-[var(--accent)]{{else}}text-[var(--muted)]{{end}}" type="submit" aria-label="Negative feedback" aria-pressed="{{if eq .Feedback "down"}}true{{else}}false{{end}}">👎</button></form>
</div>{{end}}
