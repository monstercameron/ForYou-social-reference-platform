{{define "share-panel"}}<section class="share-panel" aria-label="Share and embed post"><div class="share-heading"><strong>Share this post</strong><form class="thread-action" data-share-close action="/posts/{{.Post.ID}}" method="get"{{if not .Standalone}} get="/share/fragment" target="#share-{{.Post.ID}}(innerHTML)" timeout="5000" onerror="#thread-error(innerHTML)"{{end}}><input type="hidden" name="id" value="{{.Post.ID}}"><input type="hidden" name="view" value="closed"><button class="detail-control" type="submit">Close</button></form></div><label for="post-url-{{.Post.ID}}">Post URL</label><div class="detail-copy-row"><input id="post-url-{{.Post.ID}}" readonly value="{{.PostURL}}"><button type="button" class="detail-copy js-only" data-copy-target="post-url-{{.Post.ID}}" aria-label="Copy post URL">{{template "icon-detail-copy" .}}<span>Copy</span></button></div><label for="embed-code-{{.Post.ID}}">Embed code</label><div class="detail-copy-row detail-code-row"><textarea id="embed-code-{{.Post.ID}}" readonly rows="4">{{.Code}}</textarea><button type="button" class="detail-copy js-only" data-copy-target="embed-code-{{.Post.ID}}" aria-label="Copy embed code">{{template "icon-detail-copy" .}}<span>Copy</span></button></div><p>Copy the link or code. This URL works only where this server is reachable.</p><div class="detail-live" data-copy-status role="status" aria-live="polite" aria-atomic="true"></div></section>{{end}}
