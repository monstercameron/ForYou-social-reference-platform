{{define "share-panel"}}<section class="share-panel" aria-label="Share and embed post"><div class="share-heading"><strong>Share this post</strong><form class="thread-action" data-share-close action="/posts/{{.Post.ID}}" method="get" get="/share/fragment" target="#share-{{.Post.ID}}(innerHTML)" timeout="5000" onerror="#thread-error(innerHTML)"><input type="hidden" name="id" value="{{.Post.ID}}"><input type="hidden" name="view" value="closed"><button type="submit">Close</button></form></div><label for="post-url-{{.Post.ID}}">Post URL</label><input id="post-url-{{.Post.ID}}" readonly value="{{.PostURL}}"><label for="embed-code-{{.Post.ID}}">Embed code</label><textarea id="embed-code-{{.Post.ID}}" readonly rows="3">{{.Code}}</textarea><p>Copy the link or code. This URL works only where this server is reachable.</p></section>{{end}}
