{{define "network-panel"}}
<section class="mt-5 rounded-xl border border-[var(--line)] bg-[var(--panel)] p-5">
  <h2 class="m-0 text-xl font-bold tracking-tight">Your network</h2>
  <p class="rounded-lg bg-[var(--accent-soft)] p-3 text-xs font-semibold text-[var(--accent)]"><span class="mr-1" aria-hidden="true">●</span> Provider not connected</p>
  <div class="flex justify-between gap-2 border-b border-[var(--line)] py-3 text-xs"><span>◉ &nbsp; Provider</span><strong class="text-xs font-normal text-[var(--muted)]">Not connected</strong></div>
  <div class="flex justify-between gap-2 border-b border-[var(--line)] py-3 text-xs"><span>▧ &nbsp; Media</span><strong class="text-xs font-normal text-[var(--muted)]">External links</strong></div>
  <div class="flex justify-between gap-2 pt-3 text-xs"><span>◈ &nbsp; Receipts</span><strong class="text-xs font-normal text-[var(--muted)]">Unavailable</strong></div>
</section>
{{end}}
