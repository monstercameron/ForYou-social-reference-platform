{{define "network-panel"}}
<section class="component-card network-panel">
  <h2>Your network</h2>
  <p class="network-status">{{template "icon-nav-info" .}}<span>No provider is connected</span></p>
  <dl class="network-list">
    <div><dt>{{template "icon-nav-provider" .}}<span>Provider</span></dt><dd>Not connected</dd></div>
    <div><dt>{{template "icon-nav-media" .}}<span>Media</span></dt><dd>External links</dd></div>
    <div><dt>{{template "icon-nav-receipt" .}}<span>Receipts</span></dt><dd>Unavailable</dd></div>
  </dl>
</section>
{{end}}
